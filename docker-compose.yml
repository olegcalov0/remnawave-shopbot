services:
  remnawave-shopbot:
    build: .
    restart: unless-stopped
    ports:
      - '1488:1488'
      - '8000:8000'
    volumes:
      # код и БД (users.db живёт в корне проекта)
      - .:/app/project
      # отдельный volume для бэкапов и manifest-файлов:
      # backup_manager пишет архивы db-backup-*.zip и *.manifest.json
      - shopbot-backups:/app/project/backups
    container_name: remnawave-shopbot
    # healthcheck: Flask-админка отвечает на /test-webhook
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:1488/test-webhook', timeout=10)\" || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s
    # логирование с ротацией (scheduler/fulfillment worker пишут много)
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  shopbot-backups:
